---
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name:
      mappingMethod: claim
      type: LDAP
      ldap:
        attributes:
          id:
            - sAMAccountName
          email:
            - mail
          name:
            - cn
          preferredUsername:
            - sAMAccountName
        bindDN: ""
        bindPassword:
          name: ldap-secret
        ca:
          name: ca-config-map
        url: "ldaps://"
